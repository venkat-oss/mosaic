data:
  density_data:
    type: table
    query: SELECT * FROM (VALUES (0,'A',1),(1,'A',2),(2,'A',3),(3,'A',2),(4,'A',1),(0,'B',2),(1,'B',1),(2,'B',2),(3,'B',1),(4,'B',2)) AS t(value,series,weight)
plot:
  - data:
      from: density_data
    mark: densityY
    x: value
    fill: series
    bins: 32
    normalize: false
    bandwidth: 8
xDomain:
  - 0
  - 4
width: 360
height: 220
