name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Test in Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazelisk test --config=ci //:node_checks
      - run: bazelisk build --config=ci //docs:site //packages/examples:build

  browser:
    name: Test in Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bin/visual-test.sh
      - name: Upload Playwright results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: bazel-testlogs/packages/**/browser_tests/test.outputs/

  python:
    name: Test in Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazelisk test --config=ci //:python_checks

  rust:
    name: Test in Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazelisk build --config=ci //packages/server/duckdb-server-rust:duckdb-server //packages/server/duckdb-server-rust:benchmark //packages/server/duckdb-server-rust:clippy
      - run: bazelisk test --config=ci //packages/server/duckdb-server-rust:check //packages/server:protocol_rust

  go:
    name: Test in Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazelisk build --config=ci //packages/server/duckdb-server-go:duckdb-server
      - run: bazelisk test --config=ci //packages/server/duckdb-server-go:check //packages/server:protocol_go

  postgres:
    name: Test PostgreSQL connector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazelisk test --config=ci //packages/server/postgres:integration_test
