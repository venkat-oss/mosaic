[project]
name = "duckdb-server"
description = "A DuckDB server for Mosaic"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=2.0.0",
  "msgspec>=0.22.0",
  "platformdirs>=4.13.5",
  "pyarrow>=26.0.0",
  "starlette>=1.9.0",
  "uvicorn>=0.54.0",
  "zttp>=0.0.34",
]

[project.scripts]
duckdb-server = "pkg.__main__:serve"

[project.urls]
homepage = "https://github.com/uwdata/mosaic"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0",
  "pytest>=9.1.1",
  "ruff>=0.17.2",
  "watchfiles>=1.3.0",
  "ty>=0.0.91",
  "pyarrow-stubs>=20.0.0.20260819",
  "httpx2>=2.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pkg"]

[tool.hatch.version]
path = "package.json"
pattern = "\"version\": \"(?P<version>.+?)\""

[tool.ty.src]
include = ["pkg"]
