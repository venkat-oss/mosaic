[package]
name = "duckdb-server"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/uwdata/mosaic"
description = "DuckDB Server for Mosaic."
license = "BSD-3-Clause"
exclude = [
    "data/*",
    ".vscode/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.0.0", default-features = true, features = ["chrono-tz"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["http1", "http2", "json", "tokio", "tracing", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
axum-server-dual-protocol = "0.7.0"
clap = { version = "4.6.7", features = ["derive"] }
duckdb = { version = "1.20000.0", default-features = false, features = ["url", "r2d2"] }
futures = "0.3.34"
listenfd = "1.0.2"
r2d2 = "0.8.10"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-full", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
bundled = ["duckdb/bundled", "duckdb/json", "duckdb/parquet"]

[dev-dependencies]
criterion = {version = "0.8.2", features=["async_futures", "html_reports"]}
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "benchmark"
harness = false

[profile.release]
codegen-units = 1
