<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
  <div id="map"></div>
  <output id="result"></output>
  <script type="module">
    import { Coordinator, RestConnector } from '@uwdata/mosaic-core';
    import { Query, centroidX, centroidY, geojson, tableRef, column } from '@uwdata/mosaic-sql';
    import { createAPIContext } from '@uwdata/vgplot';
    import { parseSpec, astToDOM } from '@uwdata/mosaic-spec';

    window.nativeSpatialReady = (async () => {

      const coordinator = new Coordinator(new RestConnector({ uri: window.__MOSAIC_DATABASE_URI }), {
        logger: null, cache: false, consolidate: false
      });
      const errors = [];
      coordinator.logger({ ...coordinator.logger(), error: error => errors.push(error.message) });
      const api = createAPIContext({ coordinator });
      const name = "native geo's rows";
      const spec = parseSpec({
        data: { [name]: { type: 'spatial', file: 'visual-native-spatial.geojson', replace: true } },
        plot: [{ mark: 'geo', data: { from: name }, fill: 'steelblue', stroke: 'white' }],
        width: 320, height: 180
      });
      const { element } = await astToDOM(spec, { api, baseURL: new URL('./', location.href).href });
      document.querySelector('#map').append(element);
      await Promise.all([...coordinator.clients].map(client => client.pending));
      const field = column('geom', tableRef('main', name));
      const rows = await coordinator.query(Query.from(name).select({
        name: 'name', geometry: geojson(field), x: centroidX(field), y: centroidY(field)
      }).orderby('name'));
      document.querySelector('#result').textContent = JSON.stringify([...rows].map(row =>
        [row.name, row.x, row.y, JSON.parse(row.geometry).type]));
      return { coordinator, element, errors };
    })();
  </script>
</body>
</html>
